name: CI

on:
  push:
    branches: [main, master, 'feat/**', 'release/**']
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - name: JS Lint
        run: npm run lint
      - name: CSS Lint
        run: npm run lint:css

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=high

  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    env:
      NO_COLOR: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - name: Unit / integration / packaging tests
        run: npm test
      - name: Golden declarations check
        run: npm run golden
      - name: Docs ↔ definitions sync check
        run: npm run docs:sync-check
      - name: Build dist
        run: npm run build:dist
      - name: Size limit
        run: npm run size
      - name: Typecheck (types/*.d.ts + tests/types fixtures)
        run: npm run typecheck
      - name: Coverage (Node 22 only)
        if: matrix.node-version == 22
        run: |
          npx c8 --exclude dist --reporter=text --reporter=lcov --check-coverage --lines 90 --branches 80 --functions 85 --statements 90 node --test "tests/**/*.test.js"
      - name: Upload coverage artifacts
        if: matrix.node-version == 22
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  build:
    name: Build & package checks
    runs-on: ubuntu-latest
    needs: [lint, audit, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - name: Build dist
        run: npm run build:dist
      - name: Packaging smoke tests (CJS/ESM imports, export map)
        run: npm run test:packaging
      - name: Lint package exports (publint)
        run: npx -y publint
      - name: Pack dry-run (inspect tarball contents)
        run: npm pack --dry-run
      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  jit-browser:
    name: JIT Engine (browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Build dist
        run: npm run build:dist
      - name: Run JIT engine browser tests
        run: npm run test:jit

  visual:
    name: Visual Regression
    # Match the committed *-chromium-win32.png screenshot baselines.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Build dist
        run: npm run build:dist
      - name: Run visual regression tests (Chromium)
        run: npx playwright test --project=chromium
